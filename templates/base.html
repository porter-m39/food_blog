<!-- templates/base.html -->

<!doctype html>
{% load static %}
<html lang="en">
  <link rel="stylesheet" type="text/css" href="{% static 'css/style.css' %}" />

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lemonhead</title>

    <!-- can include a java script here -->
  </head>

  <body>
    <div class="grid-container">
      <h1>hello</h1>

      <h1>hola</h1>

      <h1>hi</h1>
    </div>

    {% comment %}
    <div class="grid-container">
      <header class="site-header">
        <div class="header-search">
          <form action="{% url 'site_search' %}" method="get">
            <input
              name="search_entry"
              type="text"
              placeholder="Search site..."
            />
          </form>
        </div>

        <h1 class="site-title">lemonhead</h1>
        <nav class="header-links">
          <a href="{% url 'posts:post_index' %}" class="header-link">food</a>
          <a href="{% url 'coffee:coffee_index' %}" class="header-link"
            >coffee</a
          >
        </nav>
      </header>

      {% block page_title %}
      <!-- This is where the title of each child template page goes -->
      {% endblock page_title %} {% block page_content %}
      <!-- Content from child templates goes here -->
      {% endblock page_content %}
    </div>
    {% endcomment %}
  </body>
</html>
